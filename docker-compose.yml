version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:80"
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: pos
      DB_USERNAME: pos
      DB_PASSWORD: secret

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pos
      MYSQL_USER: pos
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  dbdata:
